# CI verification smoke (pytest + golden SSE + typecheck + build).
# Vercel Git handles production deploys separately.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: PayFlow and build smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mcp-server/requirements.txt

      - name: Install Python dependencies
        run: pip install -r mcp-server/requirements.txt

      - name: PayFlow pytest
        run: npm run test:mcp

      - name: Golden PayFlow SSE tests
        env:
          PAYFLOW_MCP_MODE: embedded
          PAYFLOW_TEST_FAST: "1"
        run: npm run test:payflow-sse

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
